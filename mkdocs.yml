site_name: APEx Geospatial Explorer — Config Builder Guide
site_description: End-user guide for building, validating, and exporting APEx Geospatial Explorer configurations.
docs_dir: docs
site_dir: public/guide
site_url: https://ge-config-builder.apex.esa.int/guide/
use_directory_urls: false

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    # navigation.sections removed so nested groups (Data sources, Charts, …)
    # inside a tab render as collapsible chevrons instead of always-visible
    # bold headers.
    - navigation.indexes
    - navigation.prune
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - search.suggest
    - search.highlight
  icon:
    status:
      draft: material/pencil-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/nav-groups.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

