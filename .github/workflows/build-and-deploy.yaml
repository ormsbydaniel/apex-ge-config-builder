name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        type: choice
        options:
          - dev
          - prod
        default: dev
  push:
    # Temporary: auto-build and deploy to dev when pushing this branch (remove after merge to main).
    branches:
      - deployment-process
    # Also trigger when the MkDocs sources change so public/guide/ stays in sync.
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/build-and-deploy.yaml'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Sync dist to OBS
        env:
          AWS_ACCESS_KEY_ID: ${{ env.DEPLOY_ENV == 'prod' && secrets.OTC_S3_ACCESS_KEY_ID_PROD || secrets.OTC_S3_ACCESS_KEY_ID_DEV }}
          AWS_SECRET_ACCESS_KEY: ${{ env.DEPLOY_ENV == 'prod' && secrets.OTC_S3_SECRET_KEY_ID_PROD || secrets.OTC_S3_SECRET_KEY_ID_DEV }}
          AWS_DEFAULT_REGION: ${{ vars.OTC_S3_REGION }}
          AWS_EC2_METADATA_DISABLED: true
          # OBS does not decode AWS CLI's default aws-chunked checksum uploads; objects
          # are stored with chunk framing in the body instead of the real file content.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          S3_BUCKET: ${{ env.DEPLOY_ENV == 'prod' && vars.OTC_S3_BUCKETNAME_PROD || vars.OTC_S3_BUCKETNAME_DEV }}
          S3_ENDPOINT: ${{ vars.OTC_S3_ENDPOINT_URL }}
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}/" \
            --delete \
            --endpoint-url "${S3_ENDPOINT}" \
            --exclude "*.html" \
            --cache-control "public,max-age=31536000,immutable" \
            --only-show-errors

          find dist -name '*.html' -print0 | while IFS= read -r -d '' file; do
            key="${file#dist/}"
            aws s3 cp "${file}" "s3://${S3_BUCKET}/${key}" \
              --endpoint-url "${S3_ENDPOINT}" \
              --cache-control "no-cache" \
              --content-type "text/html" \
              --only-show-errors
          done
